---
- name: "End-to-End Test"
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../ansible-testing/vars/main.yml

  pre_tasks:
    - name: Load CNV resource claim
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../.cnv.env"
        name: cnv_claim

    - name: Extract cluster credentials
      ansible.builtin.set_fact:
        cluster_api_url: "{{ cnv_claim.status.summary.provision_data.openshift_api_url }}"
        cluster_admin_token: "{{ cnv_claim.status.summary.provision_data.openshift_cluster_admin_token }}"
        cluster_apps_domain: "{{ cnv_claim.status.summary.provision_data.openshift_cluster_ingress_domain }}"
        cluster_users: "{{ cnv_claim.status.summary.provision_data.users }}"

    - name: Build test instructor
      ansible.builtin.set_fact:
        test_user: "{{ (cluster_users | dict2items | map(attribute='key') | sort | first) }}"
        test_password: "{{ cluster_users[(cluster_users | dict2items | map(attribute='key') | sort | first)].password }}"

  tasks:
    # ── Validate OpenShift API ──
    - name: "E2E: Verify OpenShift API health"
      ansible.builtin.uri:
        url: "{{ cluster_api_url }}/healthz"
        validate_certs: false
        status_code: 200

    # ── Validate Gitea ──
    - name: "E2E: Verify Gitea API"
      ansible.builtin.uri:
        url: "https://gitea-{{ gitea_namespace }}.{{ cluster_apps_domain }}/api/v1/version"
        validate_certs: false
        status_code: 200

    - name: "E2E: Verify test user's Gitea repo exists"
      ansible.builtin.uri:
        url: "https://gitea-{{ gitea_namespace }}.{{ cluster_apps_domain }}/api/v1/repos/{{ test_user }}/ansible-challenge"
        validate_certs: false
        status_code: 200
        user: "{{ test_user }}"
        password: "{{ test_password }}"
        force_basic_auth: true

    # ── Validate CTFd ──
    - name: "E2E: Verify CTFd instance is serving"
      ansible.builtin.uri:
        url: "https://island-{{ test_user }}-{{ ctfd_ns_suffix }}.{{ cluster_apps_domain }}"
        validate_certs: false
        status_code: 200
        follow_redirects: safe

    - name: "E2E: Verify CTFd API is accessible"
      ansible.builtin.uri:
        url: "https://island-{{ test_user }}-{{ ctfd_ns_suffix }}.{{ cluster_apps_domain }}/api/v1/challenges"
        validate_certs: false
        status_code: [200, 302, 403]
        follow_redirects: safe

    # ── Validate Dev Spaces ──
    - name: "E2E: Verify Dev Spaces route"
      ansible.builtin.uri:
        url: "https://devspaces.{{ cluster_apps_domain }}"
        validate_certs: false
        status_code: [200, 302, 403]
        follow_redirects: safe

    # ── Validate Managed Node VM ──
    - name: "E2E: Verify managed node VM exists"
      kubernetes.core.k8s_info:
        api_version: kubevirt.io/v1
        kind: VirtualMachine
        namespace: "{{ test_user }}-{{ lab_ns_suffix }}"
        name: "{{ test_user }}-node"
        api_key: "{{ cluster_admin_token }}"
        host: "{{ cluster_api_url }}"
        validate_certs: false
      register: vm_info

    - name: "E2E: Assert VM exists and is running"
      ansible.builtin.assert:
        that:
          - vm_info.resources | length == 1
          - vm_info.resources[0].spec.running | default(false) == true
        fail_msg: "Managed node VM {{ test_user }}-node is not running"

    # ── Summary ──
    - name: E2E test summary
      ansible.builtin.debug:
        msg: |
          ══════════════════════════════════════════
           End-to-End Test Results
          ══════════════════════════════════════════
           OpenShift API:     PASS
           Gitea API:         PASS
           Gitea repo:        PASS
           CTFd instance:     PASS
           Dev Spaces:        PASS
           Managed node VM:   PASS
          ══════════════════════════════════════════
           All checks passed for user: {{ test_user }}
