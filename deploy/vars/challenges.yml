# ── Advanced challenges (verifier-based) ──────
ctfd_challenges_advanced:
  - name: "First Landing: Deploy a File"
    description: >-
      Write an Ansible playbook that deploys a file to your managed node at `/opt/island/beacon.txt`
      containing exactly `the island welcomes you`.


      Once your playbook has run successfully, validate your solution:

      ```
      curl -X POST https://<verifier-url>/validate \
        -H 'Content-Type: application/json' \
        -d '{"token": "YOUR_TOKEN", "challenge": "deploy-file"}'
      ```
    value: 50
    category: Automation Basics
    state: visible
    prerequisites:
      - You found a treasure chest
    flags:
      - content: "{{ ctfd_flags.deploy_file }}"
        type: regex
        data: case_insensitive
    hints:
      - content: >-
          Use the `ansible.builtin.copy` module with the `content` parameter.
        cost: 5
      - content: >-
          Your playbook should use `become: true` since `/opt` requires root to write into.
        cost: 15
