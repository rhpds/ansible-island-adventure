---
# Create student users in Keycloak (sso realm) for Dev Spaces + OCP access.

- name: Get Keycloak admin token
  ansible.builtin.uri:
    url: "{{ keycloak_url }}/realms/master/protocol/openid-connect/token"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: password
      client_id: admin-cli
      username: "{{ keycloak_admin_user }}"
      password: "{{ keycloak_admin_password }}"
    validate_certs: false
  register: _kc_token

- name: Create student users in Keycloak
  ansible.builtin.uri:
    url: "{{ keycloak_url }}/admin/realms/sso/users"
    method: POST
    body_format: json
    body:
      username: "{{ item.1 }}"
      enabled: true
      emailVerified: true
      email: "{{ item.1 }}@island.local"
      firstName: "{{ item.1 }}"
      lastName: Student
      credentials:
        - type: password
          value: "{{ _all_student_creds[item.0.name].students[item.1] }}"
          temporary: false
    headers:
      Authorization: "Bearer {{ _kc_token.json.access_token }}"
    validate_certs: false
    status_code: [201, 409]
  loop: "{{ instructors | subelements('students') }}"
  loop_control:
    label: "{{ item.1 }}"

- name: Look up student Keycloak user IDs
  ansible.builtin.uri:
    url: "{{ keycloak_url }}/admin/realms/sso/users?username={{ item.1 }}&exact=true"
    method: GET
    headers:
      Authorization: "Bearer {{ _kc_token.json.access_token }}"
    validate_certs: false
  register: _kc_users
  loop: "{{ instructors | subelements('students') }}"
  loop_control:
    label: "{{ item.1 }}"

- name: Ensure student profile is complete (lastName required by realm)
  ansible.builtin.uri:
    url: "{{ keycloak_url }}/admin/realms/sso/users/{{ _kc_users.results[idx].json[0].id }}"
    method: PUT
    body_format: json
    body:
      lastName: Student
    headers:
      Authorization: "Bearer {{ _kc_token.json.access_token }}"
    validate_certs: false
    status_code: [204]
  loop: "{{ instructors | subelements('students') }}"
  loop_control:
    label: "{{ item.1 }}"
    index_var: idx

- name: Reset student passwords to match current credentials
  ansible.builtin.uri:
    url: "{{ keycloak_url }}/admin/realms/sso/users/{{ _kc_users.results[idx].json[0].id }}/reset-password"
    method: PUT
    body_format: json
    body:
      type: password
      value: "{{ _all_student_creds[item.0.name].students[item.1] }}"
      temporary: false
    headers:
      Authorization: "Bearer {{ _kc_token.json.access_token }}"
    validate_certs: false
    status_code: [204]
  loop: "{{ instructors | subelements('students') }}"
  loop_control:
    label: "{{ item.1 }}"
    index_var: idx

- name: Report Keycloak configuration complete
  ansible.builtin.debug:
    msg: >-
      Keycloak: {{ instructors | map(attribute='students') | flatten | length }} student users
      created/updated in 'sso' realm for Dev Spaces + OCP access
