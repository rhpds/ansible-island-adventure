---
# Configure AAP resources for one instructor via the Gateway API.

- name: "{{ _inst.name }} — Look up org ID"
  ansible.builtin.uri:
    url: "{{ aap_url }}/api/gateway/v1/organizations/?name={{ _inst.name }}"
    method: GET
    user: admin
    password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: false
  register: _org

- name: "{{ _inst.name }} — Set org ID"
  ansible.builtin.set_fact:
    _org_id: "{{ _org.json.results[0].id }}"

# ── Inventory with student managed nodes ─────────────────────────
- name: "{{ _inst.name }} — Create inventory"
  ansible.builtin.uri:
    url: "{{ aap_url }}/api/controller/v2/inventories/"
    method: POST
    body_format: json
    body:
      name: "Workshop Inventory"
      organization: "{{ _org_id }}"
      description: "Managed nodes for {{ _inst.name }}'s students"
    user: "{{ _inst.name }}"
    password: "{{ _inst.password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [201, 400]
  register: _inventory

- name: "{{ _inst.name }} — Look up inventory ID"
  ansible.builtin.uri:
    url: "{{ aap_url }}/api/controller/v2/inventories/?name=Workshop+Inventory&organization={{ _org_id }}"
    method: GET
    user: "{{ _inst.name }}"
    password: "{{ _inst.password }}"
    force_basic_auth: true
    validate_certs: false
  register: _inv_lookup

- name: "{{ _inst.name }} — Set inventory ID"
  ansible.builtin.set_fact:
    _inv_id: "{{ _inv_lookup.json.results[0].id }}"

- name: "{{ _inst.name }} — Add student hosts to inventory"
  ansible.builtin.uri:
    url: "{{ aap_url }}/api/controller/v2/hosts/"
    method: POST
    body_format: json
    body:
      name: "{{ item }}-node.{{ _inst.lab_ns }}.svc.cluster.local"
      inventory: "{{ _inv_id }}"
      variables: |
        ansible_host: {{ item }}-node.{{ _inst.lab_ns }}.svc.cluster.local
        ansible_user: {{ vm_ssh_user }}
        ansible_password: {{ _all_student_creds[_inst.name].students[item] }}
        ansible_become: true
    user: "{{ _inst.name }}"
    password: "{{ _inst.password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [201, 400]
  loop: "{{ _inst.students }}"
  no_log: true

# ── Machine Credential ───────────────────────────────────────────
- name: "{{ _inst.name }} — Create machine credential"
  ansible.builtin.uri:
    url: "{{ aap_url }}/api/controller/v2/credentials/"
    method: POST
    body_format: json
    body:
      name: "Machine Credential"
      organization: "{{ _org_id }}"
      credential_type: 1
      inputs:
        username: "{{ vm_ssh_user }}"
        become_method: sudo
    user: "{{ _inst.name }}"
    password: "{{ _inst.password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [201, 400]

# ── Student users in AAP ─────────────────────────────────────────
- name: "{{ _inst.name }} — Create student AAP users"
  ansible.builtin.uri:
    url: "{{ aap_url }}/api/gateway/v1/users/"
    method: POST
    body_format: json
    body:
      username: "{{ item }}"
      password: "{{ _all_student_creds[_inst.name].students[item] }}"
      email: "{{ item }}@island.local"
      first_name: "{{ item }}"
      is_superuser: false
    user: admin
    password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [201, 400]
  loop: "{{ _inst.students }}"
  no_log: true

- name: "{{ _inst.name }} — Look up student AAP user IDs"
  ansible.builtin.uri:
    url: "{{ aap_url }}/api/gateway/v1/users/?username={{ item }}"
    method: GET
    user: admin
    password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: false
  register: _aap_student_lookups
  loop: "{{ _inst.students }}"
  loop_control:
    label: "{{ item }}"

- name: "{{ _inst.name }} — Update student AAP passwords"
  ansible.builtin.uri:
    url: "{{ aap_url }}/api/gateway/v1/users/{{ _aap_student_lookups.results[idx].json.results[0].id }}/"
    method: PATCH
    body_format: json
    body:
      password: "{{ _all_student_creds[_inst.name].students[item] }}"
    user: admin
    password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200]
  loop: "{{ _inst.students }}"
  loop_control:
    index_var: idx
    label: "{{ item }}"
  no_log: true

- name: "{{ _inst.name }} — Look up student user IDs and add to org"
  ansible.builtin.include_tasks: add_student_to_org.yml
  loop: "{{ _inst.students }}"
  loop_control:
    loop_var: _student

- name: "{{ _inst.name }} — Report AAP inventory configured"
  ansible.builtin.debug:
    msg: >-
      AAP for {{ _inst.name }}: inventory with {{ _inst.students | length }} hosts,
      machine credential, {{ _inst.students | length }} student users added to org
