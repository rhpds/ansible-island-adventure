---
# Seed AAP with per-student inventory, credentials, and role assignments.
# Each student has their own org with their own managed node.

- name: Configure AAP resources for each instructor's students
  ansible.builtin.include_tasks: per_student.yml
  loop: "{{ instructors | subelements('students') }}"
  loop_control:
    loop_var: _ctx
    label: "{{ _ctx.1 }}"
