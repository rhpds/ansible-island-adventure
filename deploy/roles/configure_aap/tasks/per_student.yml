---
# Configure AAP resources for one student.
# _ctx is [instructor_dict, student_name] from subelements.

- name: "{{ _ctx.1 }} — Set student context"
  ansible.builtin.set_fact:
    _student: "{{ _ctx.1 }}"
    _inst: "{{ _ctx.0 }}"
    _student_pw: "{{ _all_student_creds[_ctx.0.name].students[_ctx.1] }}"

- name: "{{ _student }} — Look up student org ID"
  ansible.builtin.uri:
    url: "{{ aap_url }}/api/gateway/v1/organizations/?name={{ _student }}"
    method: GET
    user: admin
    password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: false
  register: _org

- name: "{{ _student }} — Set org ID"
  ansible.builtin.set_fact:
    _org_id: "{{ _org.json.results[0].id }}"

# ── Student user ─────────────────────────────────────────────────
- name: "{{ _student }} — Create AAP user"
  ansible.builtin.uri:
    url: "{{ aap_url }}/api/gateway/v1/users/"
    method: POST
    body_format: json
    body:
      username: "{{ _student }}"
      password: "{{ _student_pw }}"
      email: "{{ _student }}@island.local"
      first_name: "{{ _student }}"
      is_superuser: false
    user: admin
    password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [201, 400]

- name: "{{ _student }} — Look up AAP user ID"
  ansible.builtin.uri:
    url: "{{ aap_url }}/api/gateway/v1/users/?username={{ _student }}"
    method: GET
    user: admin
    password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: false
  register: _user

- name: "{{ _student }} — Set user ID"
  ansible.builtin.set_fact:
    _user_id: "{{ _user.json.results[0].id }}"

- name: "{{ _student }} — Update AAP password"
  ansible.builtin.uri:
    url: "{{ aap_url }}/api/gateway/v1/users/{{ _user_id }}/"
    method: PATCH
    body_format: json
    body:
      password: "{{ _student_pw }}"
    user: admin
    password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [200]
  no_log: true

# ── Assign granular org roles ────────────────────────────────────
- name: "{{ _student }} — Assign org roles to student"
  ansible.builtin.uri:
    url: "{{ aap_url }}/api/gateway/v1/role_user_assignments/"
    method: POST
    body_format: json
    body:
      user: "{{ _user_id }}"
      role_definition: "{{ item.id }}"
      object_id: "{{ _org_id }}"
    user: admin
    password: "{{ aap_admin_password }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [201, 400, 409]
  loop:
    - { id: 5, name: "Organization Member" }
    - { id: 22, name: "Organization Project Admin" }
    - { id: 7, name: "Organization JobTemplate Admin" }
    - { id: 10, name: "Organization Credential Admin" }
    - { id: 17, name: "Organization Inventory Admin" }
  loop_control:
    label: "{{ item.name }}"

# ── Inventory with student's managed node ────────────────────────
- name: "{{ _student }} — Create inventory"
  ansible.builtin.uri:
    url: "{{ aap_url }}/api/controller/v2/inventories/"
    method: POST
    body_format: json
    body:
      name: "Workshop Inventory"
      organization: "{{ _org_id }}"
      description: "Managed node for {{ _student }}"
    user: "{{ _student }}"
    password: "{{ _student_pw }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [201, 400]

- name: "{{ _student }} — Look up inventory ID"
  ansible.builtin.uri:
    url: "{{ aap_url }}/api/controller/v2/inventories/?name=Workshop+Inventory&organization={{ _org_id }}"
    method: GET
    user: "{{ _student }}"
    password: "{{ _student_pw }}"
    force_basic_auth: true
    validate_certs: false
  register: _inv

- name: "{{ _student }} — Add managed node host to inventory"
  ansible.builtin.uri:
    url: "{{ aap_url }}/api/controller/v2/hosts/"
    method: POST
    body_format: json
    body:
      name: "{{ _student }}-node.{{ _inst.lab_ns }}.svc.cluster.local"
      inventory: "{{ _inv.json.results[0].id }}"
      variables: |
        ansible_host: {{ _student }}-node.{{ _inst.lab_ns }}.svc.cluster.local
        ansible_user: {{ vm_ssh_user }}
        ansible_password: {{ _student_pw }}
        ansible_become: true
    user: "{{ _student }}"
    password: "{{ _student_pw }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [201, 400]
  no_log: true

# ── Machine Credential ───────────────────────────────────────────
- name: "{{ _student }} — Create machine credential"
  ansible.builtin.uri:
    url: "{{ aap_url }}/api/controller/v2/credentials/"
    method: POST
    body_format: json
    body:
      name: "Machine Credential"
      organization: "{{ _org_id }}"
      credential_type: 1
      inputs:
        username: "{{ vm_ssh_user }}"
        password: "{{ _student_pw }}"
        become_method: sudo
    user: "{{ _student }}"
    password: "{{ _student_pw }}"
    force_basic_auth: true
    validate_certs: false
    status_code: [201, 400]
  no_log: true

- name: "{{ _student }} — Report AAP configured"
  ansible.builtin.debug:
    msg: >-
      AAP for {{ _student }}: org, inventory (1 host), machine credential, 5 roles assigned
