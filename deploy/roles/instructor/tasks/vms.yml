---
# Managed nodes are RHEL UBI containers with SSHD, not KubeVirt VMs.
# Each student gets a pod accessible via SSH from verifier and AAP.

- name: "{{ instructor.name }} — Generate student passwords"
  ansible.builtin.set_fact:
    _student_passwords: >-
      {{ _student_passwords | default({}) | combine({
        item: lookup('password', '/dev/null length=12 chars=ascii_letters,digits')
      }) }}
  loop: "{{ instructor.students }}"

- name: "{{ instructor.name }} — Deploy managed node pod for each student"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ item }}-node"
        namespace: "{{ instructor.lab_ns }}"
        labels:
          app: "{{ item }}-node"
          island-adventure/instructor: "{{ instructor.name }}"
          island-adventure/student: "{{ item }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: "{{ item }}-node"
        template:
          metadata:
            labels:
              app: "{{ item }}-node"
          spec:
            containers:
              - name: node
                image: "registry.access.redhat.com/ubi9/ubi-init:latest"
                command:
                  - /bin/bash
                  - -c
                  - |
                    dnf install -y openssh-server python3 procps-ng sudo && \
                    ssh-keygen -A && \
                    useradd -m {{ vm_ssh_user }} && \
                    echo '{{ vm_ssh_user }}:{{ _student_passwords[item] }}' | chpasswd && \
                    echo '{{ vm_ssh_user }} ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/{{ vm_ssh_user }} && \
                    mkdir -p /run/sshd && \
                    /usr/sbin/sshd -D -e
                ports:
                  - containerPort: 22
                    name: ssh
                securityContext:
                  privileged: false
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
  loop: "{{ instructor.students }}"

- name: "{{ instructor.name }} — Create Service for each student node"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ item }}-node"
        namespace: "{{ instructor.lab_ns }}"
      spec:
        selector:
          app: "{{ item }}-node"
        ports:
          - name: ssh
            port: 22
            targetPort: 22
  loop: "{{ instructor.students }}"

- name: "{{ instructor.name }} — Store student credentials"
  ansible.builtin.set_fact:
    _all_student_creds: >-
      {{ _all_student_creds | default({}) | combine({
        instructor.name: {
          'students': _student_passwords,
          'instructor_password': instructor.password
        }
      }) }}
