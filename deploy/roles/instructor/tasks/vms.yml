---
# Deploy one managed node pod per instructor.

- name: "{{ instructor.name }} — Deploy managed node pod"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: "{{ instructor.name }}-node"
        namespace: "{{ instructor.lab_ns }}"
        labels:
          app: "{{ instructor.name }}-node"
          island-adventure/instructor: "{{ instructor.name }}"
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: "{{ instructor.name }}-node"
        template:
          metadata:
            labels:
              app: "{{ instructor.name }}-node"
          spec:
            containers:
              - name: node
                image: "registry.access.redhat.com/ubi9/ubi-init:latest"
                command:
                  - /bin/bash
                  - -c
                  - |
                    dnf install -y openssh-server python3 procps-ng sudo && \
                    ssh-keygen -A && \
                    useradd -m {{ vm_ssh_user }} && \
                    echo '{{ vm_ssh_user }}:{{ instructor.password }}' | chpasswd && \
                    echo '{{ vm_ssh_user }} ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/{{ vm_ssh_user }} && \
                    mkdir -p /run/sshd && \
                    /usr/sbin/sshd -D -e
                ports:
                  - containerPort: 22
                    name: ssh
                securityContext:
                  privileged: false
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi

- name: "{{ instructor.name }} — Create managed node Service"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{ instructor.name }}-node"
        namespace: "{{ instructor.lab_ns }}"
      spec:
        selector:
          app: "{{ instructor.name }}-node"
        ports:
          - name: ssh
            port: 22
            targetPort: 22
