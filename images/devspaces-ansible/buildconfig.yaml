apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: aia-devspaces-ansible
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: aia-devspaces-ansible
spec:
  runPolicy: Serial
  source:
    type: Binary
    binary: {}
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: aia-devspaces-ansible:latest
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi
