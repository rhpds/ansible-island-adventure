approach: ansible

infrastructure:
  type: ocp-cnv
  ocp_version: "4.21"
  multi_user: true
  users_per_deployment: 10

operators:
  - name: ansible-automation-platform-operator
    channel: stable-2.7
    source: redhat-operators
    purpose: Ansible Automation Platform 2.7 — Gateway + Controller

  - name: devspaces
    channel: stable
    source: redhat-operators
    purpose: Red Hat OpenShift Dev Spaces — browser-based IDE

  - name: kubevirt-hyperconverged
    channel: stable
    source: redhat-operators
    purpose: OpenShift Virtualization — provisions RHEL 9 managed node VMs

applications:
  - name: ctfd
    image: ctfd/ctfd:3.7.7
    per_user: true
    purpose: CTF scoring platform — one instance per instructor
    dependencies:
      - mariadb (mariadb:10.4.12)
      - redis (redis:4)

  - name: gitea
    image: gitea/gitea:1.20.1-rootless
    per_user: false
    purpose: Shared Git hosting — per-instructor user accounts and repos

  - name: ctf-verifier
    image: quay.io/l3acon/ctf-verifier:latest
    per_user: true
    purpose: Challenge verification sidecar — validates automation results on managed nodes

rbac:
  - name: per-instructor namespaces
    description: >-
      Each instructor gets two namespaces: {user}-ctfd (CTFd stack)
      and {user}-lab (managed node VM). Standard RBAC for namespace-scoped access.

seed_data:
  - name: ctfd-challenges
    source: vars/challenges.yml + vars/flags.yml (vault-encrypted)
    description: >-
      Challenge definitions, flag values, hints, and scoring configuration
      loaded into each instructor's CTFd instance at deploy time.

  - name: gitea-repos
    source: https://github.com/l3acon/ansible-challenge.git
    description: >-
      The ansible-challenge repository is forked into each instructor's
      Gitea account, providing playbooks and vault-encrypted files for challenges.

  - name: aap-configuration
    source: configure_aap role
    description: >-
      Per-instructor AAP organizations, inventories (with managed node),
      and machine credentials (SSH keypair for VM access).

network:
  - name: external-registries
    endpoints:
      - registry.redhat.io
      - registry.access.redhat.com
      - docker.io
      - quay.io
      - github.com
    purpose: Pull operator images, container images, and challenge source repos

provision_data:
  - key: island_adventure
    format: dict keyed by instructor username
    fields:
      - instructor.username
      - instructor.password
      - urls.ctfd
      - urls.gitea
      - urls.aap
      - urls.devspaces
      - urls.verifier
      - urls.ocp_console
      - aap_org
      - managed_node
    purpose: >-
      Per-instructor handout data published via set_stats for Showroom
      credential display and handout generation.

notes: >-
  The deployment is fully automated via ansible-testing/deploy.yml. The
  playbook is idempotent and supports tag-scoped re-runs (e.g. --tags ctfd)
  for targeted updates. All challenge flags are vault-encrypted. Per-instructor
  VMs are RHEL 9 provisioned via OpenShift Virtualization with cloud-init.
