spec:
  title: Ansible Island Adventure
  learning_objectives:
  - Deploy the Ansible Island Adventure environment on a Red Hat OpenShift cluster
    by running the provided Ansible playbook to produce a fully functional CTFd scoring
    platform, Gitea repositories, and per-player credentials
  - Demonstrate how to facilitate a customer-facing CTF event using the provided facilitation
    guidance, handout templates, and pacing recommendations for groups of varying
    size and technical background
  - Configure challenge definitions, difficulty tiers, and content to tailor the event
    for specific customer use cases or partner engagements
  - Analyze participant engagement metrics and create a follow-up plan to convert
    attendees into qualified leads
  modules:
  - id: module-01
    title: Welcome to the island
    duration_min: 15
    status: not_started
  - id: module-02
