  deployment_mode: rhdp_published
  initiative_key: rh1_2027
  showroom_type: classic
  intake_type: new
  automation_type: ansible
  description: 'This is a "teach the teacher" course. The goal is to have our session
    enable other Red Hatters to run CTF competitions around the product (Ansible Automation
    Platform). '
  jira_ticket: RHDPCD-1137
  workflow_id: c4935515-c6cf-4c89-aced-2ec235b16c5a
spec:
  title: Ansible Island Adventure
  learning_objectives:
  - Navigate the pre-deployed Ansible Island Adventure environment on Red Hat OpenShift,
    identifying the architecture components (CTFd, Gitea, MariaDB, Redis, AAP, Dev Spaces)
    and understanding the deployment artifacts that provisioned them
  - Demonstrate how to facilitate a customer-facing CTF event using the provided facilitation
    guidance, handout templates, and pacing recommendations for groups of varying
    size and technical background
  - Configure challenge definitions, difficulty tiers, and content for customer use
    cases, applying progress-preserving updates and distinguishing them from board
    resets
  - Analyze participant engagement metrics and create a follow-up plan to convert
    attendees into qualified leads
  modules:
  - id: module-01
    title: Welcome to the island
    duration_min: 10
    status: complete
  - id: module-02
    title: Prerequisites and logistics
    duration_min: 10
    status: complete
  - id: module-03
    title: Play the game
    duration_min: 50
    status: complete
  - id: module-04
    title: Explore the environment
    duration_min: 20
    status: complete
  - id: module-05
    title: Customize and extend
    duration_min: 20
    status: complete
  - id: module-06
    title: From event to pipeline
    duration_min: 10
    status: complete
