approval_checklist:
  content:
    prerequisites_verifiable: false
    assessment_strategy: ''
    catalog_gap: Existing CTF labs on the catalog are security-focused and participant-facing
      (DevSecOps investigation). No content teaches Red Hatters how to deploy, facilitate,
      and generate pipeline from the Ansible Island Adventure CTF platform for customer
      engagements.
    design_overview: "A teach-the-teacher lab that enables Red Hatters (SAs, TAMs,\
      \ partner engineers) to use, deliver, and customize Ansible Island Adventure\
      \ \u2014 a gamified CTF competition built on Red Hat Ansible Automation Platform\
      \ and OpenShift. The environment arrives pre-deployed from RHDP; the lab focuses\
      \ on facilitation, customization, and pipeline generation."
    module_summaries:
    - title: Welcome to the island
      overview: Introduces the Ansible Island Adventure concept, pirate-themed narrative,
        challenge categories and difficulty tiers, and how gamification drives engagement
        across mixed skill levels.
    - title: Prerequisites and logistics
      overview: Covers ordering the pre-deployed environment from RHDP, staffing ratios,
        pre-event preparation (credential distribution, handouts), room setup, and
        event pacing.
    - title: Play the game
      overview: Participant access and survival-kit workspace setup, 35 minutes of
        scored play including Warm Up, then debrief and saved results for the later
        reset and engagement analysis. Instructor setup follows gameplay.
    - title: Explore the environment
      overview: Architecture tour, second instructor workspace, personal OpenShift
        login and lab-password vault setup, followed by a controlled personal-board
        reset. Verify retained infrastructure and re-solve one Warm Up challenge.
    - title: Customize and extend
      overview: Modify definitions and apply update-challenges.yml, verifying that
        the post-reset solve remains. Contrast updates with board resets and review
        organizer provisioning and handout references outside the training clock.
    - title: From event to pipeline
      overview: 'Positioning the event for customers, capturing lead data through CTFd,
        analyzing engagement metrics, building a follow-up plan, and accessing resources
        for independent delivery.'
    rcars_overlap_pct: 75
    rcars_top_matches:
    - title: Unmasking the Attack - A DevSecOps CTF on OpenShift
      ci_name: sandboxes-gpte.devsecops-ctf-on-openshift.prod
      url: https://catalog.demo.redhat.com/catalog?item=sandboxes-gpte.devsecops-ctf-on-openshift.prod
      relevance_score: 75
      why_it_fits: CTF-style workshop on OpenShift with hands-on investigation experience,
        but focuses on DevSecOps security rather than Ansible Automation Platform
        or CTF facilitation training.
    - title: 'Code Red: The Breach Challenge!'
      ci_name: published.code-red-breach-challenge.prod
      url: https://catalog.demo.redhat.com/catalog?item=published.code-red-breach-challenge.prod
      relevance_score: 74
      why_it_fits: CTF-format lab on OpenShift teaching participants to investigate
        security vulnerabilities, but is participant-facing rather than facilitator-training
        for deploying the Ansible Island Adventure platform.
    rejections:
    - id: d3ea0a5f-271f-43ba-b45c-e3663e3ef468
      text: I would like this to start with Ansible Island Adventure deployed. The
        lab should focus on A) how to use and deliver it and B) how to change/modify
        it. We should not want people to have to install this on their own, but rather
        order it as a supported item from RHDP.
      resolved: true
      reviewer: nstephan@redhat.com
      timestamp: '2026-08-26T10:27:14.776334+00:00'
